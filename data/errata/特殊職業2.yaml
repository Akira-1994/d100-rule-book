sheet: 特殊職業2

entries:
  # 規則書作者 2026-09-20 裁示：咒火使者的〈頑強〉指的就是一般專長表的
  # 同名技能，不是咒火使者專屬的新技能，因此沿用該條的效果敘述。
  - row: 3
    col: 4
    reason: >-
      咒火使者「基本前置專長」的〈頑強〉原表只有分類與難度、沒有效果。
      作者確認這指的就是一般專長表第 29 列的〈頑強〉（同為難度 1），
      是入職門檻的交叉引用而非新技能，因此沿用其效果敘述。
    set:
      tags: [入職門檻, 與一般專長〈頑強〉為同一技能]
      effect: >-
        當生命值降至－1～－9，你的狀況依舊穩定，不須擲強韌檢定是否每回合損失1 點HP
