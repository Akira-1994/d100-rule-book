# 詞綴部位 → 角色卡裝備欄位的對應。
#
# 詞綴表寫的是物品種類（16 種），角色卡寫的是身體欄位。兩套詞彙原本對不
# 起來，武器與盾牌甚至不在範例卡的十格裡（被塞在「其他」）。
# 以下全部經規則書作者 2026-09-20 逐項確認。
#
# 注意「主手／副手」不是我們發明的詞 —— 規則書本身就在用：
#   〈武器使用(充能斧)〉「你的主手需綁定一個單手武器、副手需綁定一個盾牌」
#   〈雙手武器大師〉「每1.5技能等級多1次主手攻擊次數」
#   〈戰鬥專攻〉「雙武器戰鬥：你的副手在此技能…」

equipment_slots:
  - {code: 頭,        note: 頭環類}
  - {code: 手,        note: 手套類}
  - {code: 手臂,      note: 手環類}
  - {code: 身體,      note: 鎧甲類}
  - {code: 披風}
  - {code: 腰帶}
  - {code: 鞋子}
  - {code: 項鍊}
  - {code: 戒指（左）}
  - {code: 戒指（右）}
  - {code: 主手, note: 規則書用語；武器、法杖、魔導槍械、盾牌皆可}
  - {code: 副手, note: 同主手。雙手武器只佔主手，是否合理由 DM 裁定}

mappings:
  # 一、可直接對應
  - {affix_slot: 頭環,   slots: [頭]}
  - {affix_slot: 手套,   slots: [手]}
  - {affix_slot: 手環,   slots: [手臂]}
  - {affix_slot: 鎧甲,   slots: [身體]}
  - {affix_slot: 披風,   slots: [披風]}
  - {affix_slot: 腰帶,   slots: [腰帶]}
  - {affix_slot: 鞋子,   slots: [鞋子]}
  - {affix_slot: 項鍊,   slots: [項鍊]}

  # 二、一種部位對應兩格
  - affix_slot: 戒指
    slots: [戒指（左）, 戒指（右）]
    note: >-
      作者確認：同一條詞綴兩枚戒指都可以附，且效果疊加
      （兩枚戒指各自是獨立的魔法物品）。

  # 三、原本沒有欄位的手持物
  - {affix_slot: 武器,       slots: [主手, 副手]}
  - {affix_slot: 武器(弓),   slots: [主手, 副手], note: 武器的子類，詞綴僅限弓類武器}
  - {affix_slot: 魔導槍械,   slots: [主手, 副手]}
  - {affix_slot: 法杖,       slots: [主手, 副手]}
  - affix_slot: 盾牌
    slots: [主手, 副手]
    note: >-
      作者裁示主副手皆可、App 不擋，雖然〈武器使用(充能斧)〉寫的是
      「副手需綁定一個盾牌」。

  # 四、語意需要定義的兩項
  - affix_slot: 主要裝備
    slots: [身體]
    note: >-
      作者確認「主要裝備」就是鎧甲（身體欄）。與資料一致：〈精金〉〈密銀〉
      的效果都寫「主要裝備、盾牌: 物抗／法抗…」這類防禦效果，而〈龍麟〉
      〈五色龍龍麟〉本身就是防具素材。
  - affix_slot: 全
    slots: [頭, 手, 手臂, 身體, 披風, 腰帶, 鞋子, 項鍊, 戒指（左）, 戒指（右）, 主手, 副手]
    note: >-
      作者確認：所有部位都可以，包含武器與盾牌。目前只有〈吉兆〉使用，
      其效果（重骰次數 = 魔法物品總加值÷6）本來就與裝備種類無關。

# 不做硬性檢核的項目（作者裁示，Phase 4 只警告不阻擋）
soft_rules:
  - 雙手武器只佔主手；副手是否還能放東西由 DM 裁定。
  - 四種武器類部位（武器、武器(弓)、魔導槍械、法杖）主手副手都能放。
  - 盾牌主副手都可。
