sheet: 詞墜(依物品分類)

# 分布表與詞綴表的名稱不一致。規則書作者 2026-09-20 裁示：一律以詞綴表為準。
# 同一個名稱在分布表裡出現多次，因此用別名一次對正而非逐列勘誤。
affix_name_aliases:
  - from: 重拳
    to: 重拳【打臉】
    reason: >-
      手套分布表寫「重拳」，詞綴表登錄為「重拳【打臉】」。作者裁示以詞綴表
      為準（分布表出現 5 處）。
  - from: 金屬感知
    to: 金屬偵測感知
    reason: >-
      法杖分布表寫「金屬感知」，詞綴表登錄為「金屬偵測感知」。以詞綴表為準。
  - from: 炙焰
    to: 炙燄
    reason: >-
      魔導槍械分布表寫「炙焰」，武器分布表與詞綴表寫的是「炙燄」（焰／燄 不同字）。
      以詞綴表為準（分布表出現 3 處）。
  - from: 閃電增幅
    to: 電擊增幅
    reason: >-
      法杖分布表的「閃電增幅」在詞綴表裡查無此條。作者確認是「電擊增幅」
      的筆誤（分布表出現 3 處）。

