    reason: >-
      〈知識〉的難度欄寫 1or2，是因為這是一個「元技能」——學哪一門知識決定難度。
      作者裁示：不列舉各門知識，由玩家與 DM 在建卡時個案裁定為 1 或 2。
      App 應在此條提供難度選擇，而非固定值。

