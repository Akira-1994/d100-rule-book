# 素材詞綴的勘誤
#
# 這張表的同一列同時承載素材本身與它的第一條詞綴（合併儲存格所致），
# 因此每一筆勘誤都必須用 target: 指明是 material 還是 material_affix。

sheet: 素材詞綴

entries:
  - row: 14
    target: material_affix
    reason: >-
      〈五色龍龍牙〉的〈五色龍龍息【一】〉機率區間寫 1~71，但下一階
      〈五色龍龍息【二】〉是 71~90，擲出 71 會同時符合兩條。
      全表其餘 20 種素材一律是 1~70／71~90／91~100，故更正為 1~70。
    set:
      roll_max: 70
